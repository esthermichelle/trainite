# Eval-only config for the true held-out range: 13-20 digits.
#
# `data.val` is the 7-12 range (for comparison with A0's 9.9% OOD number) and
# `data.test` is 13-20, which is never generated by the 6->12 ladder.  This is
# the headline OOD number for the full A2 run.
project_name: arithmetic-addition
preprocessor:
  _target_: preprocessors.char_tokenizer.CharTokenizer
  charset: 0123456789+
model:
  _target_: models.abacus_transformer.AbacusTransformerModel
  collate_fn_target: models.causal_lm.CausalLMCollateFn
  hidden_size: 256
  num_layers: 8
  num_heads: 8
  feedforward_dim: 1024
  dropout: 0.0
  max_seq_len: 1024
  max_offset: 100
  digit_token_start: 5
  num_digit_tokens: 10
data:
  train:
    dataset:
      _target_: dataset_impl.arithmetic_addition.ArithmeticAdditionDataset
      size: 1000
      train_size: 1000
      val_size: 100
      min_digits: 2
      max_digits: 6
      seed: 42
      split: train
      reverse_digits: true
    transform:
      _target_: dataset_impl.prompt_completion.PromptCompletionTransform
      ignore_index: -100
    dataloader:
      batch_size: 128
      shuffle: false
      num_workers: 4
  val:
    dataset:
      _target_: dataset_impl.arithmetic_addition.ArithmeticAdditionDataset
      size: 5000
      min_digits: 7
      max_digits: 12
      seed: 200
      split: test
      reverse_digits: true
    transform:
      _target_: dataset_impl.prompt_completion.PromptCompletionTransform
      ignore_index: -100
    dataloader:
      batch_size: 128
      shuffle: false
      num_workers: 4
  test:
    dataset:
      _target_: dataset_impl.arithmetic_addition.ArithmeticAdditionDataset
      size: 8000
      min_digits: 13
      max_digits: 20
      seed: 300
      split: test
      reverse_digits: true
    transform:
      _target_: dataset_impl.prompt_completion.PromptCompletionTransform
      ignore_index: -100
    dataloader:
      batch_size: 128
      shuffle: false
      num_workers: 4
trainer:
  epochs: 1
  max_inference_new_tokens: 32
  eval_batch_size: 128
output:
  root: outputs
  run_name: eval-13-20
logger: tensorboard
wandb:
  enabled: false
  project: arithmetic-addition
  mode: disabled
seed: 42
device: null
