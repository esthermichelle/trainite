# Eval-only config for the smoke-test frontier: unseen 9- and 10-digit operands.
#
# evaluate.py scores `data.val` (labelled "validation (ID)" in the log) and
# `data.test` (labelled "test (OOD)").  Here those are 9x9 and 10x10 digits, so
# a single invocation reports both frontier lengths.
#
#   ./.venv/bin/python evaluate.py config_si_eval_9_10.yaml \
#       --checkpoint <run>/rounds/round_02/model.pt --skip-wandb --skip-tensorboard
project_name: arithmetic-addition
preprocessor:
  _target_: preprocessors.char_tokenizer.CharTokenizer
  charset: 0123456789+
model:
  _target_: models.abacus_transformer.AbacusTransformerModel
  collate_fn_target: models.causal_lm.CausalLMCollateFn
  hidden_size: 256
  num_layers: 8
  num_heads: 8
  feedforward_dim: 1024
  dropout: 0.0
  max_seq_len: 1024
  max_offset: 100
  digit_token_start: 5
  num_digit_tokens: 10
data:
  train:
    dataset:
      _target_: dataset_impl.arithmetic_addition.ArithmeticAdditionDataset
      size: 1000
      train_size: 1000
      val_size: 100
      min_digits: 2
      max_digits: 6
      seed: 42
      split: train
      reverse_digits: true
    transform:
      _target_: dataset_impl.prompt_completion.PromptCompletionTransform
      ignore_index: -100
    dataloader:
      batch_size: 128
      shuffle: false
      num_workers: 4
  val:
    dataset:
      _target_: dataset_impl.arithmetic_addition.ArithmeticAdditionDataset
      size: 2000
      min_digits: 9
      max_digits: 9
      seed: 900
      split: test
      reverse_digits: true
    transform:
      _target_: dataset_impl.prompt_completion.PromptCompletionTransform
      ignore_index: -100
    dataloader:
      batch_size: 128
      shuffle: false
      num_workers: 4
  test:
    dataset:
      _target_: dataset_impl.arithmetic_addition.ArithmeticAdditionDataset
      size: 2000
      min_digits: 10
      max_digits: 10
      seed: 1000
      split: test
      reverse_digits: true
    transform:
      _target_: dataset_impl.prompt_completion.PromptCompletionTransform
      ignore_index: -100
    dataloader:
      batch_size: 128
      shuffle: false
      num_workers: 4
trainer:
  epochs: 1
  max_inference_new_tokens: 16
  eval_batch_size: 128
output:
  root: outputs
  run_name: eval-9-10
logger: tensorboard
wandb:
  enabled: false
  project: arithmetic-addition
  mode: disabled
seed: 42
device: null
