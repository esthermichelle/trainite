project_name: arithmetic-addition
preprocessor:
  _target_: preprocessors.char_tokenizer.CharTokenizer
  charset: 0123456789+
model:
  _target_: models.abacus_transformer.AbacusTransformerModel
  collate_fn_target: models.causal_lm.CausalLMCollateFn
  hidden_size: 256
  num_layers: 4
  num_heads: 8
  feedforward_dim: 1024
  dropout: 0.0
  max_seq_len: 1024
  max_offset: 100
  digit_token_start: 5
  num_digit_tokens: 10
optimizer:
  _target_: torch.optim.AdamW
  lr: 0.001
loss:
  _target_: models.causal_lm.CausalLMCrossEntropyLoss
  ignore_index: -100
data:
  train:
    dataset:
      _target_: dataset_impl.arithmetic_addition.ArithmeticAdditionDataset
      size: 150000
      train_size: 150000
      val_size: 5000
      min_digits: 2
      max_digits: 6
      seed: 42
      split: train
      reverse_digits: true
    transform:
      _target_: dataset_impl.prompt_completion.PromptCompletionTransform
      ignore_index: -100
    dataloader:
      batch_size: 128
      shuffle: true
      num_workers: 8
      pin_memory: true
      persistent_workers: true
      prefetch_factor: 4
  val:
    dataset:
      _target_: dataset_impl.arithmetic_addition.ArithmeticAdditionDataset
      size: 5000
      train_size: 150000
      val_size: 5000
      min_digits: 2
      max_digits: 6
      seed: 42
      split: val
      reverse_digits: true
    transform:
      _target_: dataset_impl.prompt_completion.PromptCompletionTransform
      ignore_index: -100
    dataloader:
      batch_size: 128
      shuffle: false
      num_workers: 8
      pin_memory: true
      persistent_workers: true
      prefetch_factor: 4
  test:
    dataset:
      _target_: dataset_impl.arithmetic_addition.ArithmeticAdditionDataset
      size: 5000
      min_digits: 7
      max_digits: 12
      seed: 200
      split: test
      reverse_digits: true
    transform:
      _target_: dataset_impl.prompt_completion.PromptCompletionTransform
      ignore_index: -100
    dataloader:
      batch_size: 128
      shuffle: false
      num_workers: 8
      pin_memory: true
      persistent_workers: true
      prefetch_factor: 4
trainer:
  epochs: 150
  log_every_steps: 500
  early_stopping_patience: null
  inference_every_epochs: 100
  inference_num_samples: 5
  max_inference_new_tokens: 24
  grad_clip_norm: 1.0
  eval_batch_size: 256
  exact_match_every_epochs: null
output:
  root: outputs
  run_name: abacus-adamw-large-local
logger: tensorboard
wandb:
  enabled: true
  project: arithmetic-addition
  entity: null
  mode: auto
  tags:
  - abacus
  - adamw
  - large
  - local-150k
  run_name: abacus-adamw-large-local
  resume: true
seed: 42
device: null
