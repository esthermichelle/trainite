
project_name: arithmetic-addition-rope-baseline

preprocessor:
  _target_: trainite.preprocessors.char_tokenizer.CharTokenizer
  charset: "0123456789+"

model:
  _target_: trainite.models.rope_transformer.RoPETransformerModel
  collate_fn_target: trainite.models.rope_transformer.CausalLMCollateFn
  hidden_size: 64
  num_layers: 2
  num_heads: 2
  feedforward_dim: 128
  dropout: 0.1
  max_seq_len: 128

optimizer:
  _target_: torch.optim.AdamW
  lr: 0.001

data:
  train:
    dataset:
      _target_: trainite.datasets.arithmetic_addition.ArithmeticAdditionDataset
      size: 10000
      min_digits: 2
      max_digits: 4
      seed: 42
    transform:
      _target_: trainite.datasets.string_reverse.PromptCompletionTransform
      ignore_index: -100
    dataloader:
      batch_size: 128
      shuffle: true
      num_workers: 0

  val:
    dataset:
      _target_: trainite.datasets.arithmetic_addition.ArithmeticAdditionDataset
      size: 1000
      min_digits: 2
      max_digits: 4
      seed: 100
    transform:
      _target_: trainite.datasets.string_reverse.PromptCompletionTransform
      ignore_index: -100
    dataloader:
      batch_size: 128
      shuffle: false
      num_workers: 0

  test:
    dataset:
      _target_: trainite.datasets.arithmetic_addition.ArithmeticAdditionDataset
      size: 1000
      min_digits: 5
      max_digits: 5
      seed: 200
    transform:
      _target_: trainite.datasets.string_reverse.PromptCompletionTransform
      ignore_index: -100
    dataloader:
      batch_size: 128
      shuffle: false
      num_workers: 0

trainer:
  epochs: 10
  log_every_steps: 20
  early_stopping_patience: 3
  inference_every_epochs: 5
  inference_num_samples: 5
  max_inference_new_tokens: 16
  grad_clip_norm: 1.0

output:
  root: outputs
  run_name: arithmetic_addition_rope_baseline

logger: tensorboard
seed: 42
device: null
