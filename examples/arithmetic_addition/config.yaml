project_name: arithmetic-addition-rope-baseline

preprocessor:
  _target_: trainite.preprocessors.char_tokenizer.CharTokenizer
  charset: "0123456789+"

model:
  _target_: trainite.models.rope_transformer.RoPETransformerModel
  collate_fn_target: trainite.models.rope_transformer.CausalLMCollateFn
  hidden_size: 128
  num_layers: 3
  num_heads: 4
  feedforward_dim: 512
  dropout: 0.0
  max_seq_len: 128

optimizer:
  _target_: torch.optim.AdamW
  lr: 0.001

loss:
  _target_: trainite.models.rope_transformer.CausalLMCrossEntropyLoss
  ignore_index: -100

data:
  train:
    dataset:
      _target_: dataset_impl.arithmetic_addition.ArithmeticAdditionDataset
      size: 50000
      train_size: 50000
      val_size: 1000
      min_digits: 2
      max_digits: 4
      seed: 42
      split: train
    transform:
      _target_: trainite.datasets.string_reverse.PromptCompletionTransform
      ignore_index: -100
    dataloader:
      batch_size: 128
      shuffle: true
      num_workers: 0

  val:
    dataset:
      _target_: dataset_impl.arithmetic_addition.ArithmeticAdditionDataset
      size: 1000
      train_size: 50000
      val_size: 1000
      min_digits: 2
      max_digits: 4
      seed: 42
      split: val
    transform:
      _target_: trainite.datasets.string_reverse.PromptCompletionTransform
      ignore_index: -100
    dataloader:
      batch_size: 128
      shuffle: false
      num_workers: 0

  test:
    dataset:
      _target_: dataset_impl.arithmetic_addition.ArithmeticAdditionDataset
      size: 1000
      min_digits: 5
      max_digits: 5
      seed: 200
      split: test
    transform:
      _target_: trainite.datasets.string_reverse.PromptCompletionTransform
      ignore_index: -100
    dataloader:
      batch_size: 128
      shuffle: false
      num_workers: 0

trainer:
  epochs: 300
  log_every_steps: 200
  early_stopping_patience: null
  inference_every_epochs: 100
  inference_num_samples: 5
  max_inference_new_tokens: 16
  grad_clip_norm: 1.0

output:
  root: outputs
  run_name: arithmetic_addition_rope_baseline

logger: tensorboard
seed: 42
device: null
